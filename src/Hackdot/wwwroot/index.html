<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="description" content="Hackdot – a pocket-sized hacking game. Learn the terminal and ethical hacking in a simulated OS." />
    <meta name="theme-color" content="#0b1016" />
    <meta name="color-scheme" content="dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Hackdot" />
    <title>Hackdot</title>
    <!-- Relative on purpose: works at '/' locally and at '/<repo>/' on GitHub Pages without rewriting this
         file after publishing (that would break its hash in the service worker's offline cache list). -->
    <base href="./" />
    <link rel="preload" id="webassembly" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="stylesheet" href="Hackdot.styles.css" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" sizes="512x512" href="icon-512.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="icon-192.png" />
    <script type="importmap"></script>
</head>

<body>
    <div id="app">
        <div class="boot">
            <span class="logo" role="img" aria-label="Hackdot">hack<span class="logo-dot">.</span></span>
            <div class="boot-bar"><span></span></div>
            <div class="boot-text"></div>
        </div>
    </div>

    <div id="blazor-error-ui">
        An unexpected error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss" aria-label="Dismiss">✕</span>
    </div>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
    <script>navigator.serviceWorker.register('service-worker.js', { updateViaCache: 'none' });</script>
</body>

</html>
